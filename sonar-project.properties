# SonarCloud analysis (design D5). Run with `make sonar` (token from SONAR_TOKEN) or in CI.
sonar.organization=marcelomiyake
sonar.projectKey=marcelomiyake_geotoon
sonar.projectName=GeoToon
sonar.links.scm=https://github.com/marcelomiyake/geotoon

sonar.sourceEncoding=UTF-8
sonar.sources=packages/core/src,packages/contracts/src,apps/api/src,apps/api/migrations,apps/api/scripts,apps/web/src,apps/web/index.html,apps/web/vite.config.ts,deploy,docker,scripts,.github
sonar.tests=packages/core/test,packages/contracts/test,apps/api/test,apps/web/test
sonar.test.inclusions=**/*.spec.ts

# Build output, coverage reports and recorded third-party data are not source code.
sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,fixtures/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Same list and reasons as coverage.exclude in vitest.config.ts:
#   apps/web/src/render/**     draws to WebGL; checked in the browser, not in Node
#   apps/web/src/main.ts       browser entry point: DOM and WebGL wiring only
#   apps/web/src/ui/search-box.ts, apps/web/src/ui/overlays.ts   DOM-only views
#   apps/api/src/main.ts       process entry point: signals and startup wiring
#   **/index.ts                re-exports only
#   apps/api/scripts/**, apps/web/vite.config.ts   developer tooling, not shipped logic
sonar.coverage.exclusions=apps/web/src/render/**,apps/web/src/main.ts,apps/web/src/ui/search-box.ts,apps/web/src/ui/overlays.ts,apps/api/src/main.ts,**/index.ts,apps/api/scripts/**,apps/web/vite.config.ts
