apiVersion: v1
kind: Service
metadata:
  name: {{ include "geotoon.postgresql" . }}
  labels:
    {{- include "geotoon.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  selector:
    {{- include "geotoon.dbSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
