{{- $pg := .Values.postgresql -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "geotoon.postgresql" . }}
  labels:
    {{- include "geotoon.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "geotoon.postgresql" . }}
  replicas: 1
  # PostGIS is a rebuildable cache of open data: uninstall removes its volume.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "geotoon.dbSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geotoon.labels" . | nindent 8 }}
        {{- include "geotoon.dbSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgis
          image: {{ $pg.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geotoon.secret" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            {{- include "geotoon.restrictedContainer" . | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "geotoon.dbSelector" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $pg.storageClassName }}
        storageClassName: {{ $pg.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage }}
